<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Connecting to J Fox Studio</title><style>body{margin:0;background:#0B0B0D;color:#F4F4F6;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.6}main{max-width:720px;margin:0 auto;padding:40px 22px}h1{font-size:28px;margin:0 0 6px}h2{font-size:18px;margin-top:28px}a{color:#FF6A2A}.bar{height:3px;background:#E3281E;margin:14px 0 24px}.muted{color:#9B9BA6;font-size:14px}.btn{display:inline-block;background:#E3281E;color:#fff;padding:14px 22px;border-radius:14px;text-decoration:none;font-weight:600} main{text-align:center;padding-top:80px}</style></head>
<body><main><h1>Connecting to J Fox Studio…</h1><p class="muted" id="msg">Sending you back to the app.</p><p><a class="btn" id="go" href="#">Open J Fox Studio</a></p>
<script>
(function(){var q=new URLSearchParams(location.search);var err=q.get('error');
if(err){document.getElementById('msg').textContent='TikTok sign-in was cancelled or failed: '+(q.get('error_description')||err);document.getElementById('go').style.display='none';return;}
var code=q.get('code'),state=q.get('state')||'';
if(!code){document.getElementById('msg').textContent='Nothing to do here. Start the TikTok connection from J Fox Studio.';document.getElementById('go').style.display='none';return;}
var url='jfoxstudio://tiktok-auth?code='+encodeURIComponent(code)+'&state='+encodeURIComponent(state);
document.getElementById('go').href=url;
history.replaceState(null,'',location.pathname);
setTimeout(function(){location.href=url;},150);})();
</script></main></body></html>
